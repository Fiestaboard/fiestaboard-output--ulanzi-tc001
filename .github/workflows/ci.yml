name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "FiestaBoard ref to test against (branch, tag or SHA)"
        required: false
        # Keep in step with `ref:` below.
        default: v10.2.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and output conformance (${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [released, native-candidate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Fiestaboard/FiestaBoard
          # First released core with the TC001 small-LED floor and UI support.
          ref: ${{ inputs.core_ref || 'v10.2.0' }}
          path: fiestaboard-core

      - name: Apply pinned native playlist candidate to the released geometry baseline
        if: matrix.core == 'native-candidate'
        working-directory: fiestaboard-core
        # Core PR #2393 targets next, which predates 10.2.0's small LED support.
        # Apply only its reviewed source delta; never follow a mutable branch.
        # pages/service.py's display-context fix is already present in 10.2.0.
        run: |
          git fetch --no-tags origin 77d757e6b71c5a6d18a998cbffba5a781c4525b4
          git diff 5aabc252ab23ec76da4756b94bfca5af4542d301 77d757e6b71c5a6d18a998cbffba5a781c4525b4 -- src ':!src/pages/service.py' > /tmp/native-playlist.patch
          git apply --check /tmp/native-playlist.patch
          git apply /tmp/native-playlist.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fiestaboard-core/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r fiestaboard-core/requirements.txt
          pip install pytest pytest-cov pytest-socket

      # The tests include core's OutputConformanceSuite run against this
      # plugin; the network fence allows loopback only.
      - name: Run tests (loopback only) with the conformance suite
        run: |
          if [ '${{ matrix.core }}' = 'released' ]; then
            ./run_tests.sh fiestaboard-core --no-cov
          else
            ./run_tests.sh fiestaboard-core
          fi
