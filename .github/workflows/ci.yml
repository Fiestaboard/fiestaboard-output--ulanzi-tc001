name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "FiestaBoard ref to test against (branch, tag or SHA)"
        required: false
        # Keep in step with `ref:` below.
        default: v10.2.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-ui:
    name: Device settings UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Fiestaboard/FiestaBoard
          ref: v10.2.0
          path: fiestaboard-core
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install existing core UI dependencies
        working-directory: fiestaboard-core/web
        run: npm ci --legacy-peer-deps
      - name: Test plugin manifest in the real settings form
        env:
          TC001_PLUGIN_DIR: ${{ github.workspace }}
        run: |
          cp tests/ui/firmware-transition-fields.test.tsx fiestaboard-core/web/src/__tests__/tc001-firmware-transition-fields.test.tsx
          cd fiestaboard-core/web
          npx vitest run src/__tests__/tc001-firmware-transition-fields.test.tsx

  test:
    name: Tests and output conformance (${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [released, native-candidate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Fiestaboard/FiestaBoard
          # Released compatibility plus the exact main-based native playlist candidate.
          ref: ${{ matrix.core == 'native-candidate' && 'ff3856cb47327630ddfbff195e0f0636154b10cc' || inputs.core_ref || 'v10.2.0' }}
          path: fiestaboard-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fiestaboard-core/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r fiestaboard-core/requirements.txt
          pip install pytest pytest-cov pytest-socket

      # The tests include core's OutputConformanceSuite run against this
      # plugin; the network fence allows loopback only.
      - name: Run tests (loopback only) with the conformance suite
        run: |
          if [ '${{ matrix.core }}' = 'released' ]; then
            ./run_tests.sh fiestaboard-core --no-cov
          else
            ./run_tests.sh fiestaboard-core
          fi
