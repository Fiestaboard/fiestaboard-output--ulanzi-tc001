name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "FiestaBoard ref to test against (branch, tag or SHA)"
        required: false
        # Keep in step with `ref:` below.
        default: 071121a683b5b02ad1263bc315a86a98b49e9794

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and output conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Fiestaboard/FiestaBoard
          # Pin the tested small-LED support from core PR #2391 while its
          # >=10.2.0 release is pending. Switch to that release once available.
          ref: ${{ inputs.core_ref || '071121a683b5b02ad1263bc315a86a98b49e9794' }}
          path: fiestaboard-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fiestaboard-core/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r fiestaboard-core/requirements.txt
          pip install pytest pytest-cov pytest-socket

      # The tests include core's OutputConformanceSuite run against this
      # plugin; the network fence allows loopback only.
      - name: Run tests (loopback only) with the conformance suite
        run: ./run_tests.sh fiestaboard-core
